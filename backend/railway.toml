# Railway deployment configuration (M3 Task 7).
# Lives at the repo root. DATABASE_URL and CORS_ORIGINS are set in the
# Railway dashboard; database.py reads DATABASE_URL directly.
# Migrations run on every deploy via the && pattern (finalised M3 plan):
# alembic upgrade head is idempotent, so repeat deploys are safe.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"