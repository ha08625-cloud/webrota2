[project]
name = "rota-backend"
version = "0.1.0"
description = "Rota generator backend (data layer, generation engine, REST API)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary",
    "python-docx",
    "python-multipart",
    "bcrypt",
    "icalendar>=7.3.0",
    # Runtime, not dev-only: app/email.py posts to the Mailgun API, and
    # nixpacks installs the backend with `pip install .`, which does not
    # pull the dev extra - a dev-only httpx would be an ImportError at
    # startup in production.
    "httpx",
]

[project.optional-dependencies]
dev = [
    # Pinned below 9.1: pytest 9.1.0 regressed conftest collection when the
    # command line interleaves directories -- `pytest tests/test_api/a.py
    # tests/b.py tests/test_api/c.py` loses tests/test_api/conftest.py for
    # the second test_api file, so every test in it errors with
    # "fixture 'client' not found". 8.3, 8.4 and 9.0 are all fine, and the
    # repro is three files and two conftests with no project code in it.
    # CI passes whole directories and never trips this; a developer running
    # "the files I touched" does. Lift the ceiling once 9.1.x fixes it.
    "pytest<9.2",
    # Enforces the module boundaries documented in architecture.md.
    # Configuration lives in [tool.importlinter] below; CI runs
    # `uv run lint-imports` before the test suite.
    "import-linter>=2.4",
    # Parallel test execution. CI runs `pytest -n auto`; see the note in
    # [tool.pytest.ini_options] below for why -n auto is NOT in addopts.
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

# -n auto is deliberately NOT here, though pytest-xdist is a dev dependency
# and CI passes it explicitly. Under xdist, output from the workers is
# interleaved and buffered until a test finishes, `pdb` cannot attach, and
# -x stops at whichever failure a worker reaches first rather than the first
# in file order. None of that matters to CI, which only reads the summary;
# all of it matters to the local "run the tests for the files I touched"
# workflow in CLAUDE.md. Add -n auto by hand when running the whole suite
# locally is what you actually want.



# ---------------------------------------------------------------------------
# import-linter: module boundary enforcement
#
# These contracts codify the domain boundaries described in
# documentation/architecture.md ("Module boundaries"). Read that section
# before changing anything here -- in particular the honest statement of
# what these contracts do NOT catch.
#
# Run locally with `uv run lint-imports`. CI runs it before the test suite.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

# WHY allow_indirect_imports = true ON EVERY CONTRACT
#
# Do not remove it. app/models/__init__.py imports every domain's models --
# it has to, because create_all and Alembic autogenerate rely on importing
# that one package to register all mappers. api/deps.py in turn imports
# app.models. So in the *indirect* import graph every module reaches every
# other module, via chains that are not boundary violations at all:
#
#   app.api.routers.reception.counters -> app.api.deps
#       app.api.deps -> app.models
#       app.models -> app.models.user
#       app.models.user -> app.models.doctor
#
# An indirect contract can therefore never pass here, however clean the code
# is. These are direct-import contracts: they catch a domain module naming
# another domain's module in its own import statements. That is exactly the
# mistake worth catching, and the convention that domain code imports model
# and schema *submodules*, never the app.models / app.api.schemas aggregates,
# is what makes a cross-domain model import a direct edge these contracts see.

[[tool.importlinter.contracts]]
name = "Reception must not import clinical code"
type = "forbidden"
allow_indirect_imports = true
# app.reception and app.api.routers.reception are packages, so these two
# entries cover every reception file added in future automatically. That is
# the payoff from moving reception into packages.
source_modules = [
    "app.reception",
    "app.api.routers.reception",
    "app.models.reception",
    "app.api.schemas.reception",
]
forbidden_modules = [
    "app.engine",
    "app.documents",
    "app.master_template",
    "app.leave_charging",
    "app.toil_credit",
    "app.leave_entitlement",
    "app.doctor_window",
    "app.calendar_feed",
    # Clinical models. bank_holidays, closure and school hold practice-wide
    # calendar data that reception could plausibly want one day; they are
    # listed here because nothing outside clinical uses them today. If
    # reception needs one, promote it to the shared kernel deliberately --
    # that is a decision with an argument attached, not a line quietly
    # deleted from this list.
    "app.models.doctor",
    "app.models.rota",
    "app.models.staging",
    "app.models.master_rota",
    "app.models.clinic_type",
    "app.models.duty",
    "app.models.duty_counter_adjustment",
    "app.models.leave",
    "app.models.leave_entitlement",
    "app.models.counter",
    "app.models.counter_snapshot",
    "app.models.room",
    "app.models.blocked",
    "app.models.extra_session",
    "app.models.generation_log",
    "app.models.recurring_note",
    "app.models.signature",
    "app.models.bank_holidays",
    "app.models.closure",
    "app.models.school",
    # Clinical request/response schemas.
    "app.api.schemas.blocked",
    "app.api.schemas.clinic_type",
    "app.api.schemas.closure",
    "app.api.schemas.counter",
    "app.api.schemas.doctor",
    "app.api.schemas.duty",
    "app.api.schemas.extra_session",
    "app.api.schemas.leave",
    "app.api.schemas.leave_entitlement",
    "app.api.schemas.leave_planning",
    "app.api.schemas.master_rota",
    "app.api.schemas.nurse_rota",
    "app.api.schemas.recurring_note",
    "app.api.schemas.room",
    "app.api.schemas.rota",
    "app.api.schemas.school",
    "app.api.schemas.signature",
    "app.api.schemas.staging",
    # Research.
    "app.research",
    "app.api.routers.research",
]

[[tool.importlinter.contracts]]
name = "Clinical must not import reception"
type = "forbidden"
allow_indirect_imports = true
# The clinical routers have to be listed longhand because they are still
# flat modules in app/api/routers/, not a package. That is the ongoing cost
# of not repackaging clinical (a deliberate choice -- see the "Out of scope"
# section of the plan this came from): a new clinical router is NOT covered
