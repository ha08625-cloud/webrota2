[[tool.importlinter.contracts]]
name = "Documents must not import domain code"
type = "forbidden"
allow_indirect_imports = true
# app.documents is a leaf today: it imports nothing from app at all. It
# renders and converts files and should stay that way, taking plain data
# from its callers rather than reaching for ORM models.
source_modules = ["app.documents"]
forbidden_modules = [
    "app.engine",
    "app.reception",
    "app.research",
    "app.models",
    "app.api",
    "app.database",
    "app.master_template",
    "app.leave_charging",
    "app.toil_credit",
    "app.leave_entitlement",
    "app.doctor_window",
    "app.calendar_feed",
]

[[tool.importlinter.contracts]]
name = "Shared kernel must not import domains"
type = "forbidden"
allow_indirect_imports = true
# The shared kernel. Adding a module to this list is a decision, not a
# convenience: an ever-growing shared kernel is how a
# modular monolith quietly becomes a layered one.
#
# app.models.user is deliberately NOT a source module here. It imports
# Doctor and ReceptionStaff under `if TYPE_CHECKING:` for its two nullable
# identity FKs, and import-linter counts TYPE_CHECKING imports as real
# edges. Those two columns are a deliberate keep -- the link is a privilege
# grant gated by user_admin, not a domain relationship -- so the exemption is
# permanent until that changes. Everything else in the kernel is covered.
source_modules = [
    "app.database",
    "app.email",
    "app.models.enums",
    "app.models.permissions",
    "app.models.audit",
    "app.models.edit_lock",
    "app.api.deps",
    "app.api.audit",
    "app.api.audit_descriptions",
    "app.api.auth_utils",
    "app.api.edit_lock",
    "app.api.schemas.common",
    # Promoted here deliberately, not for convenience, when
    # the research documents router became `safe_filename_stem`'s third
    # caller: /signatures/{id}/apply, /eoi/fill and
    # /research/studies/{id}/documents/{id} all echo a filename into a
    # Content-Disposition header and none of them may echo a
    # client-supplied path or quote while doing it. The module imports
    # nothing from `app` at all -- it is a stdlib-only filename-safety
    # helper that lives under routers/ only because that is where its
    # first two callers were, and moving the file would touch live
    # signatures and EOI routes for no gain. The kernel gains one leaf;
    # it is still the kind of addition that needs an argument.
    "app.api.routers._uploads",
]
forbidden_modules = [
    "app.engine",
    "app.documents",
    "app.reception",
    "app.research",
    "app.master_template",
    "app.leave_charging",
    "app.toil_credit",
    "app.leave_entitlement",
    "app.doctor_window",
    "app.calendar_feed",
    "app.models.doctor",
    "app.models.reception",
    "app.models.rota",
    "app.models.staging",
    "app.api.routers",
]

[[tool.importlinter.contracts]]
name = "Research must not import other domains"
type = "forbidden"
