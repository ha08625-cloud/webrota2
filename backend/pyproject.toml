[project]
name = "rota-backend"
version = "0.1.0"
description = "Rota generator backend (data layer, generation engine, REST API)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary",
    "python-docx",
    "python-multipart",
    "bcrypt",
    "icalendar>=7.3.0",
    # Runtime, not dev-only: app/email.py posts to the Mailgun API, and
    # nixpacks installs the backend with `pip install .`, which does not
    # pull the dev extra - a dev-only httpx would be an ImportError at
    # startup in production.
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"


