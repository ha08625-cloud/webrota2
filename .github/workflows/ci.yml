name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (not the project itself)
        run: uv sync --no-install-project --extra dev

      - name: Diagnose double import
        run: |
          set +e
          echo "=== plain import twice (same process) ==="
          uv run --no-sync python -c "import app.models; import app.models; print('double import OK')"
          echo "=== import then re-import models submodule by file identity ==="
          uv run --no-sync python -c "import app.models.room as r1; import importlib; print('room module:', r1.__name__, r1.__file__)"
          echo "=== run pytest collect-only, no test execution ==="
          uv run --no-sync pytest --collect-only -q 2>&1 | head -40
          echo "=== does tests/__init__.py exist? ==="
          ls -la tests/
          echo "=== pytest version ==="
          uv run --no-sync pytest --version
      - name: Run tests
        run: uv run --no-sync pytest -v