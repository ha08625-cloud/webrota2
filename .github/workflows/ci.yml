name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

  # Validates the 001 baseline (incl. the shared-enum-type fix) against a
  # real Postgres before Railway ever runs it: upgrade, downgrade, and
  # upgrade again to prove both directions and type cleanup work.
  migrations-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rota
          POSTGRES_PASSWORD: rota
          POSTGRES_DB: rota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://rota:rota@localhost:5432/rota_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Re-upgrade to head
        run: uv run alembic upgrade head